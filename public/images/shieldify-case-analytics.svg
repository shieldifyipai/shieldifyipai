<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-labelledby="title">
  <title id="title">Case analytics dashboard</title>
  <rect width="980" height="640" rx="30" fill="#0e1421"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="58" y="74" font-size="28" font-weight="700" fill="#fff">Case Analytics</text>
    <text x="58" y="108" font-size="16" fill="#9aa7bb">Platform analytics, violation types, resolution rate, and monthly enforcement.</text>
    <rect x="58" y="154" width="400" height="190" rx="20" fill="#111a2b" stroke="#2a3750"/>
    <text x="88" y="204" font-size="17" font-weight="700" fill="#fff">Violation Types</text>
    <rect x="88" y="236" width="260" height="12" rx="6" fill="#28344a"/><rect x="88" y="236" width="212" height="12" rx="6" fill="#b9fb6a"/>
    <rect x="88" y="278" width="260" height="12" rx="6" fill="#28344a"/><rect x="88" y="278" width="154" height="12" rx="6" fill="#6aa8ff"/>
    <rect x="88" y="320" width="260" height="12" rx="6" fill="#28344a"/><rect x="88" y="320" width="98" height="12" rx="6" fill="#ffcc66"/>
    <rect x="516" y="154" width="406" height="190" rx="20" fill="#111a2b" stroke="#2a3750"/>
    <text x="546" y="204" font-size="17" font-weight="700" fill="#fff">Resolution Rate</text>
    <circle cx="708" cy="269" r="56" fill="none" stroke="#28344a" stroke-width="18"/>
    <path d="M708 213a56 56 0 1 1-49 83" fill="none" stroke="#b9fb6a" stroke-width="18" stroke-linecap="round"/>
    <text x="682" y="278" font-size="26" font-weight="700" fill="#fff">88%</text>
    <rect x="58" y="388" width="864" height="190" rx="20" fill="#111a2b" stroke="#2a3750"/>
    <text x="88" y="438" font-size="17" font-weight="700" fill="#fff">Monthly Enforcement</text>
    <line x1="88" y1="538" x2="884" y2="538" stroke="#2a3750"/>
    <polyline points="88,518 188,488 288,502 388,454 488,470 588,420 688,436 788,398 884,410" fill="none" stroke="#b9fb6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
