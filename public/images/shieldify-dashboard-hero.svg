<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">Shieldify IP protection dashboard</title>
  <desc id="desc">A dark case management dashboard showing monitored content, infringements, active cases, resolution rate, platforms covered, recent cases, and monthly enforcement.</desc>
  <rect width="1180" height="720" rx="30" fill="#090d16"/>
  <rect x="24" y="24" width="1132" height="672" rx="24" fill="#0e1421" stroke="#263248"/>
  <rect x="54" y="54" width="1072" height="78" rx="18" fill="#121b2c"/>
  <text x="82" y="102" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#ffffff">Shieldify IP Command Center</text>
  <text x="790" y="100" font-family="Inter,Arial,sans-serif" font-size="15" fill="#b9fb6a">Live monitoring</text>
  <circle cx="768" cy="94" r="6" fill="#b9fb6a"/>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="54" y="156" width="238" height="126" rx="18" fill="#141e31" stroke="#27334a"/>
    <text x="78" y="195" font-size="15" fill="#9aa7bb">Content Monitored</text>
    <text x="78" y="242" font-size="40" font-weight="700" fill="#ffffff">42.8K</text>
    <text x="78" y="265" font-size="13" fill="#b9fb6a">Across 18 sources</text>

    <rect x="316" y="156" width="238" height="126" rx="18" fill="#141e31" stroke="#27334a"/>
    <text x="340" y="195" font-size="15" fill="#9aa7bb">Potential Infringements</text>
    <text x="340" y="242" font-size="40" font-weight="700" fill="#ffffff">137</text>
    <text x="340" y="265" font-size="13" fill="#ffcc66">Pending review</text>

    <rect x="578" y="156" width="238" height="126" rx="18" fill="#141e31" stroke="#27334a"/>
    <text x="602" y="195" font-size="15" fill="#9aa7bb">Active Cases</text>
    <text x="602" y="242" font-size="40" font-weight="700" fill="#ffffff">29</text>
    <text x="602" y="265" font-size="13" fill="#6aa8ff">In enforcement</text>

    <rect x="840" y="156" width="286" height="126" rx="18" fill="#141e31" stroke="#27334a"/>
    <text x="864" y="195" font-size="15" fill="#9aa7bb">Resolution Rate</text>
    <text x="864" y="242" font-size="40" font-weight="700" fill="#ffffff">88%</text>
    <rect x="864" y="256" width="214" height="8" rx="4" fill="#28344a"/>
    <rect x="864" y="256" width="188" height="8" rx="4" fill="#b9fb6a"/>
  </g>

  <rect x="54" y="310" width="520" height="332" rx="22" fill="#111a2b" stroke="#263248"/>
  <text x="84" y="356" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Recent Cases</text>
  <g font-family="Inter,Arial,sans-serif" font-size="14">
    <rect x="84" y="386" width="460" height="54" rx="12" fill="#172236"/>
    <text x="106" y="418" fill="#ffffff">Trademark misuse detected</text><text x="408" y="418" fill="#ffcc66">Review</text>
    <rect x="84" y="456" width="460" height="54" rx="12" fill="#172236"/>
    <text x="106" y="488" fill="#ffffff">Copyright copy confirmed</text><text x="405" y="488" fill="#6aa8ff">Filed</text>
    <rect x="84" y="526" width="460" height="54" rx="12" fill="#172236"/>
    <text x="106" y="558" fill="#ffffff">Counterfeit listing removed</text><text x="388" y="558" fill="#b9fb6a">Resolved</text>
  </g>

  <rect x="606" y="310" width="520" height="332" rx="22" fill="#111a2b" stroke="#263248"/>
  <text x="636" y="356" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Monthly Enforcement</text>
  <line x1="650" y1="586" x2="1088" y2="586" stroke="#2a3750"/>
  <line x1="650" y1="404" x2="650" y2="586" stroke="#2a3750"/>
  <polyline points="650,556 708,518 766,530 824,474 882,492 940,426 998,448 1056,390" fill="none" stroke="#b9fb6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="650,570 708,552 766,540 824,532 882,506 940,486 998,462 1056,430" fill="none" stroke="#6aa8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="650" y="620" font-family="Inter,Arial,sans-serif" font-size="13" fill="#9aa7bb">Case status, violation type, and platform trends</text>
</svg>
