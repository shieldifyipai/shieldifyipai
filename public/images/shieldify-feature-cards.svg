<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title">
  <title id="title">IP protection feature cards</title>
  <rect width="760" height="500" rx="28" fill="#0e1421"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="46" y="66" font-size="25" font-weight="700" fill="#fff">Protection Scope</text>
    <g fill="#141e31" stroke="#2a3750">
      <rect x="46" y="100" width="308" height="126" rx="18"/><rect x="406" y="100" width="308" height="126" rx="18"/>
      <rect x="46" y="270" width="308" height="126" rx="18"/><rect x="406" y="270" width="308" height="126" rx="18"/>
    </g>
    <g font-size="17" font-weight="700" fill="#fff">
      <text x="82" y="150">Trademark Protection</text><text x="442" y="150">Copyright Enforcement</text>
      <text x="82" y="320">Counterfeit Detection</text><text x="442" y="320">Evidence Collection</text>
    </g>
    <g font-size="14" fill="#9aa7bb">
      <text x="82" y="184">Watch marks, listings, ads</text><text x="442" y="184">Review copied creative works</text>
      <text x="82" y="354">Identify suspicious offers</text><text x="442" y="354">Preserve records for action</text>
    </g>
    <g fill="#b9fb6a"><circle cx="62" cy="145" r="7"/><circle cx="422" cy="145" r="7"/><circle cx="62" cy="315" r="7"/><circle cx="422" cy="315" r="7"/></g>
  </g>
</svg>
